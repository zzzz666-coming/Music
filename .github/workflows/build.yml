name: Build MusicBridge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Build Android debug APK
        run: gradle -p android-app assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: musicbridge-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  fabric-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2"
      - name: Build Fabric 1.21.11 mod
        run: gradle -p minecraft-mod build
      - uses: actions/upload-artifact@v4
        with:
          name: musicbridge-fabric-1.21.11
          path: minecraft-mod/build/libs/musicbridge-*.jar
          if-no-files-found: error
